[project]
name = "lol-coach"
version = "0.1.0"
description = "Personal League of Legends coach"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
